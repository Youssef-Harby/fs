<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Twin Solution</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.82/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.82/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <link
      href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 h-screen flex flex-col">
    <!-- Top Navbar -->
    <nav
      class="bg-white-500 p-4 text-white shadow-md flex justify-between items-center"
    >
      <img src="./assets/imgs/tabaqat_logo.png" alt="tabaqat Logo" white;"
      class="h-14">
      <h1 class="text-2l font-semibold text-black">Digital Twin Solution</h1>
    </nav>

    <!-- Main Content (Cesium container) -->
    <div id="cesiumContainer" class="flex-1 relative overflow-hidden">
      <div
        id="toolbar"
        class="absolute top-14 left-4 bg-gray-100 p-1 pl-3 pr-3 rounded-md shadow-md z-10 bg-opacity-80"
      >
        <div class="flex items-center space-x-4">
          <span>Water Level</span>
          <input
            type="range"
            min="0"
            max="1000"
            step="1"
            data-bind="value: waterLevel, valueUpdate: 'input'"
            class="w-3/10"
          />
        </div>
      </div>

      <!-- Floating Chart -->
      <div
        id="gauge_div"
        class="absolute bottom-14 right-4 p-2 bg-gray-100 rounded-md shadow-md z-10 bg-opacity-80"
      ></div>
    </div>

    <div
      id="alertModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      "
    >
      <div
        style="
          width: 200px;
          height: 300;
          background: rgb(255, 64, 64);
          margin: 100px auto;
          padding: 20px;
          text-align: center;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        "
      >
        <h1 style="font-size: 100px; color: white">!</h1>
        <p style="color: white">Water level is critical!</p>
      </div>
    </div>

    <script src="app.js"></script>
    <script src="mychart.js"></script>
  </body>
</html>
